version: 2

sphinx:
  configuration: docs/conf.py

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    pre_build:
      - |
        set -eux
        JULIA_VERSION=1.12.6
        echo "Installing Julia ${JULIA_VERSION}"
        curl --fail --location --silent --show-error \
          "https://julialang-s3.julialang.org/bin/linux/x64/1.12/julia-${JULIA_VERSION}-linux-x86_64.tar.gz" \
          --output /tmp/julia.tar.gz
        tar -xzf /tmp/julia.tar.gz -C /tmp
        export PATH="/tmp/julia-${JULIA_VERSION}/bin:$PATH"
        julia --version
        echo "Instantiating docs environment"
        julia --project=docs docs/instantiate.jl
        echo "Building Documenter site"
        julia --project=docs docs/make.jl

    post_build:
      - |
        set -eux
        echo "Publishing Documenter site"
        mkdir -p "$READTHEDOCS_OUTPUT/html"
        cp -R docs/build-clean/. "$READTHEDOCS_OUTPUT/html/"

formats:
  - htmlzip
  - pdf
  - epub

python:
  install: []
