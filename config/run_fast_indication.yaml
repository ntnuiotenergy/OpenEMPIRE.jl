# Reduced europe_v51 config for a FAST indication of the transmission-cap patch.
# Keeps all 49 nodes but shrinks scenarios/horizon/hours ~37x for quick turnaround.

# --- Horizon and resolution ---
forecast_horizon_year: 2030             # 2 strategic periods (vs 5)
leap_years_investment: 5                # Years per investment period
number_of_scenarios: 1                  # 1 scenario (vs 3)
length_of_regular_season: 24            # 24 h per season (vs 168)
regular_seasons: ["winter", "spring", "summer", "fall"]  # Regular seasons modelled
n_peak_seasons: 2                       # Number of peak seasons
len_peak_season: 24                     # Hours in each peak season
operational_hours_per_year: 8760        # Only used by chronological full-year out-of-sample runs

# --- Optional modules (hydrogen and industry require natural_gas) ---
natural_gas: False                      # Natural-gas module
hydrogen: False                         # Hydrogen/CO2 module; requires natural_gas
industry: False                         # Industry module; requires natural_gas
number_of_gas_scenarios: 1              # Must be 1 when hydrogen or industry is on
offshore_transmission_cap: False        # Off to match this config's Python baseline run

# --- Economics and emissions ---
discount_rate: 0.05                     # Rate used to discount future cash flows to present value
wacc: 0.05                              # Weighted average cost of capital
use_emission_cap: True                  # True = CO2 cap (CO2cap.csv); False = CO2 price (CO2price.csv)
load_change_module: False               # Not used by the model; recorded for out-of-sample checks

# --- Scenario sampling ---
use_scenario_generation: True           # Sample scenarios from the raw time series
use_fixed_sample: False                 # Reduced dims have no matching sampling_key; seed makes it reproducible
time_format: "%d/%m/%Y %H:%M"           # Time format for scenario data files
filter_make: False                      # Cluster the candidate windows, write filter_result.csv
filter_use: False                       # Sample only from those clusters
n_cluster: 10                           # Number of clusters for filter_make
copula_clusters_make: False             # Cluster on co-movement between variables
copula_clusters_use: False              # Copula-based scenario generation (strata/filter approach)
copulas_to_use: ["electricload"]        # Any of ["electricload", "hydroror", "hydroseasonal", "solar", "windoffshore", "windonshore"]

# --- Output ---
write_raw_solution: False               # Also write the raw JuMP solution

# --- InternalEMPIRE compatibility (absent = off; set only for parity runs) ---
# internalempire_missing_hydro_raw_default_mw: 1.0  # Fill missing seasonal-hydro samples (Pyomo default=1)
# internalempire_missing_line_efficiency_default: 0.97  # Fill missing line efficiencies (Pyomo default=0.97)

# --- Solver ---
# solver_* keys are passed to Gurobi; an empty value keeps the Gurobi default.
optimization_solver: "Gurobi"           # Informational only; the solver is chosen with --solver
solver_method: 2                        # 2 = barrier (interior point), usually best for large LPs
solver_crossover: 0                     # 0 = skip crossover
solver_presolve: 2                      # 1 = conservative, 2 = aggressive (2 has stalled the barrier at full scale)
solver_numericfocus:                    # 1-3 = progressively more numerical care
solver_barhomogeneous:                  # 1 = homogeneous barrier; robust on difficult runs
solver_barconvtol:                      # Barrier convergence tolerance
solver_feasibilitytol:                  # Primal feasibility tolerance
solver_scaleflag:                       # Robustness option; can slow solves
solver_seed:                            # Random seed
solver_threads:                         # Set to the physical core count if needed
