# Full natural-gas parity run: full_model_int, 2055 / 5 scenarios / 168-hour seasons.
# Use the same fixed sampling_key.csv on Julia and InternalEMPIRE.

use_temporary_directory: True
temporary_directory: './'
forecast_horizon_year: 2055
number_of_scenarios: 5
natural_gas: True
number_of_gas_scenarios: 1
length_of_regular_season: 168
discount_rate: 0.05
wacc: 0.05
optimization_solver: "Gurobi"
use_scenario_generation: True
use_fixed_sample: True
# Bug-for-bug compatibility with InternalEMPIRE's Pyomo Param(default=1.0).
internalempire_missing_hydro_raw_default_mw: 1.0
load_change_module: False
filter_make: False
filter_use: False
copula_clusters_make: False
copula_clusters_use: False
copulas_to_use: ["electricload"]
n_cluster: 10
moment_matching: False
n_tree_compare: 20
use_emission_cap: True
compute_operational_duals: False
print_in_iamc_format: False
write_in_lp_format: False
serialize_instance: False
north_sea: True
leap_years_investment: 5
time_format: "%d/%m/%Y %H:%M"

# Profile used by the certified seed-3 pair (jobs 6538/6539).
solver_method: 2
solver_crossover: 0
solver_presolve: 1
solver_numericfocus: 1
solver_barhomogeneous: 1
