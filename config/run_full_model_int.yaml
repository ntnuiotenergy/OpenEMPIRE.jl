# OpenEMPIRE configuration for the full_model_int dataset.
# Mirrors the run parameters in InternalEMPIRE/run_EMPIRE_int.py (NoOfPeriods = 7,
# 4 regular seasons of 168 h, 2 peak seasons, 5 scenarios, north sea on).
# To be used with scripts/run_julia_empire.jl.
#
# Note: full_model_int also carries industry and heat data. Those modules are not
# part of the Julia port yet; their tables live in data_extra/full_model_int/ and are
# ignored by this run. The natural-gas and Hydrogen/CO2 inputs are in the bundled CSV
# dataset, and both modules are disabled by default.
#
# REQUIRES THE NATURAL-GAS MODULE. InternalEMPIRE prices natural gas through its
# gas module rather than through Generator!FuelCosts, so this dataset has no
# genFuelCost row for Gasexisting, GasOCGT, GasCCGT, GasCCSadv or GasCCS. Until
# the `natural_gas` module lands, building this dataset stops with an explicit
# error naming the generator instead of pricing gas generation at zero. The
# dataset, converter and validator are delivered first so the module can be
# reviewed against fixed, hash-verified inputs.


use_temporary_directory: True                          # Specifies whether to use a temporary directory for operations
temporary_directory: './'                              # Path to the temporary directory used for certain operations
forecast_horizon_year: 2055                            # 2020 + 7 periods x 5 years
number_of_scenarios: 5                                 # Number of scenarios in every investment period
natural_gas: False                                     # Enable the natural-gas operational module
hydrogen: False                                        # Requires natural_gas=true; deterministic evidence supports one gas scenario
industry: False                                        # Requires natural_gas=true; Hydrogen enables H2/CCS/refinery pathways
number_of_gas_scenarios: 1                             # Terminal-price scenarios (weather × gas is solved)
length_of_regular_season: 168                          # Number of hours in a regular season
discount_rate: 0.05                                    # Rate used to discount future cash flows to present value
wacc: 0.05                                             # Weighted average cost of capital
optimization_solver: "Gurobi"                          # Mathematical solver used for optimization tasks
use_scenario_generation: True                          # Indicates if scenarios should be generated dynamically
use_fixed_sample: True                                 # full_model_int ships a sampling_key.csv (FIX_SAMPLE in run_EMPIRE_int.py)
load_change_module: False                              #
filter_make : False                                    #
filter_use : False                                     #
copula_clusters_make: False                            # Make copula clusters (for copula-strata SGR)
copula_clusters_use: False                             # Copula-based scenario generation (strata/filter approach)
copulas_to_use: ["electricload"]                       # Emprical copula construction of ["electricload", "hydroror", "hydroseasonal", "solar", "windoffshore", "windonshore"]
n_cluster : 10                                         #
moment_matching : False                                #
n_tree_compare : 20                                    # Number of trees to compare for moment matching and copula-sampling
use_emission_cap: True                                 # Indicates if there's a cap on CO2 emissions
compute_operational_duals: False                       # Resolve empire with fixed investment variables and write new duals
print_in_iamc_format: False                            # Output should be printed in a IAMC-compatible format
write_in_lp_format: False                              # Problem should be written in Linear Programming format
serialize_instance: False                              # Serialize the data structure or model for later use
north_sea: True                                        # Whether the north sea is modelled or not
leap_years_investment: 5                               # Number of years per period (default: 5)
time_format: "%d/%m/%Y %H:%M"                          # Time format for scenario data files

# Solver (Gurobi) performance options. Leave a value commented/absent to use the Gurobi default.
solver_method: 2                                       # 2 = barrier (interior point), usually best for large LPs
solver_crossover: 0                                    # 0 = skip crossover; matches Python EMPIRE's large-run default
solver_presolve: 2                                     # 2 = aggressive presolve
# solver_threads: 16                                   # Set to physical core count on the machine if needed
